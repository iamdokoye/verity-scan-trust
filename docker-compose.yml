services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
      DATABASE_URL: ${DATABASE_URL}
      INSTITUTION_PRIVATE_KEY_PEM: ${INSTITUTION_PRIVATE_KEY_PEM}
      INSTITUTION_PUBLIC_KEY_PEM: ${INSTITUTION_PUBLIC_KEY_PEM}
      # Public origin(s) of the `frontend` service below — comma-separated,
      # used for CORS. Must match wherever the frontend is actually served.
      FRONTEND_URL: ${FRONTEND_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public URL of the `backend` service above, as reachable from a
        # user's browser (not the internal docker network) — baked into the
        # client bundle at build time. Coolify: set as a Build Variable, e.g.
        # https://api.example.com/api/v1 (a bare origin also works). Changing
        # it requires a rebuild.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
